<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cursos de Sacramentos</title>
    <script src="dom08-mouse-touch_mp.js" defer></script>
    <style>
        .boton {
            background-color: red;
            padding: 0%.5em 1em;
            color: aliceblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1 id="titulo">Eventos del DOM - Cursos de Sacramentos</h1>
    <!-- Cuarto ejemplo -->
    <div id="contenedorTriangulo"
        style="position:relative; width:100%; height:300px; margin-top:20px; background:whitesmoke;">
        <div id="triangulo" style="
       width: 0;
       height: 0;
       border-left: 50px solid transparent;
       border-right: 50px solid transparent;
       border-bottom: 100px solid crimson;
       position: absolute;
       top: 100px;
       left: calc(50% - 50px);
       transition: transform 0.2s ease;">
        </div>
    </div>

</body>

</html>
