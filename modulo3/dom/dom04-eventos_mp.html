<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cursos de Sacramentos</title>
    <script src="dom04-eventos_mp.js" defer></script>
    <style>
        .boton{
            background-color: red;
            padding: 0%.5em 1em;
            color: aliceblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Eventos del DOM - Cursos de Sacramentos</h1>
    <h2 onclick="alert('Bienvenido al sistema de sacramentos!')">Eventos Inline</h2>
    <button class="boton" id="btn" onclick="mostrarAlerta()">Alerta</button>
    <button class="boton" id="btn2" onclick="agregarInscrito()">
        Agregar Inscrito</button>
    <ul id="lista-inscritos1"></ul>
    <button class="boton" id="btn3">Agregar inscrito desde Listener</button>
    <ul id="lista-inscritos2"></ul>
    <p class="boton" id="mensaje" onclick="cambiarParrafo()">Curso sin asignar</p>

    <h2 id="cambiar">Bautismo</h2>
    <button class="boton" id="btn5" onclick="cambiar()">Alerta</button>

    <input id="campo" type="text" placeholder="Escribe el sacramento...">

    <input id="campo_actualizar_parrafo"
    type="text" placeholder="Escribe el nombre del inscrito...">
    <p id="parrafo">Valor inicial</p>

</body>
</html>
