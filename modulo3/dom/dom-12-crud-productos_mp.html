<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cursos de Sacramentos</title>
    <script src="dom-12-crud-productos_mp.js" defer></script>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 20px;
        }

        h2 {
            color: black;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;

        }

        tr:nth-child(even) {
            background-color: aliceblue;
        }

        .formulario {
            background-color: rgb(5, 123, 226);
            border: 1px solid #b0fce8;
            padding: 20px;
            margin-top: 20px;
        }

        .formulario input {
            margin: 5px;
            padding: 8px;
            width: 200px;
        }

        .formulario input {
            width: 100px;
            padding: 5px;
            margin-bottom: 8px;
        }

        .btn-agregar:hover {
            background-color: aquamarine;
            color: white;
        }

        .btn-cancelar:hover {
            background-color: rgb(255, 185, 127);
            color: white;
        }

        .stat-card{
            display: inline-block;
            width: 200px;
            padding: 15px;
            margin: 15px;
            background-color: #b0fce8;
            border: 1px solid red;
            border-radius: 5px;
            text-align: center;
        }

        .stats-card{
            margin-bottom: 10px;
            color: #555;
        }
    </style>
</head>

<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2>CRUD de Cursos de Sacramentos</h2>
    <div id="stats">
        <div class="stat-card">
            <h3>Total Cursos</h3>
            <p id="totalProductos">0</p>
        </div>
        <div class="stat-card">
            <h3>Costo Promedio</h3>
            <p id="precioPromedio">0</p>
        </div>
        <div class="stat-card">
            <h3>Curso Más Costoso</h3>
            <p id="productoMasCaro">N/A</p>
        </div>
        <div class="stat-card">
            <h3>Curso Más Económico</h3>
            <p id="productoMasBarato">N/A</p>
        </div>
    </div>
    <div>
        <h3>Agregar nuevo curso</h3>
        <label for="nombre">NOmbre:</label>
        <input type="text" id="nombre" placeholder="Nombre del curso">
        <label for="descripcion">Descripcion:</label>
        <input type="text" id="descripcion" placeholder="Descripcion del curso">
        <label for="precio">Precio:</label>
        <input type="text" id="precio" placeholder="Precio del curso">
        <button id="btn_agregar" class="btn-agregar">Agregar Curso </button>
        <button id="btn_cancelar" class="btn-cancelar">Cancelar</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Sueldo</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpoTabla"></tbody>
    </table>


</body>

</html>



</body>

</html>
