<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulación de DOM</title>
    <script src="dom04-eventos.js" defer></script>
    <style>
        .boton{
            background-color: red;
            padding: 0%.5em 1em;
            color: aliceblue;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 id="titulo">Eventos del DOM</h1>
    <h2 onclick="alert('Hello Dom!')">Eventos Inline</h2>
    <button class="boton" id="btn" onclick="mostrarAlerta()">Alerta</button>
    <button class="boton" id="btn2" onclick="agregarProducto()"">
        Agregar Producto</button>
    <ul id="lista-productos1"></ul>
    <button class="boton" id="btn3">Agregar producto desde Listener</button>
    <ul id="lista-productos2"></ul>
    <p class="boton" id="mensaje" onclick="cambiarParrafo()">Texto Original</p>

    <h2 id="cambiar">Hola</h2>
    <button class="boton" id="btn5" onclick="cambiar()">Alerta</button>

    <input id="campo" type="text" placeholder="Escibe algo...">

    <input id="campo_actualizar_parrafo" 
    type="text" placeholder="Escibe algo...">
    <p id="parrafo">Valor inicial</p>

    





</body>
</html>
