<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="04_display.css">
    <link rel="stylesheet" href="04_reset.css">
</head>

<body>
    <h1 style="color: red;">DISPLAY</h1>
    <div class="banner-oferta"> 🔥 Oferta especial: 20% en laptops</div>

    <div class="etiqueta-nuevo">Nuevo Producto</div>
    
    <button class="btn-carrito">Carrito</button>

    <button onclick="toggleMenu()">Menu</button>
    <div class="menu-movil" id="menu">
        <ul>
            
            <li><a href="#">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Contacto</a></li> 
        </ul>
    </div>
    <script>
        function toggleMenu(){
            const menu = document.getElementById('menu')
            menu.classList.toggle('activo')
        }
    </script>




    
</body>
</html>
