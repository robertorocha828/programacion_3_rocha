<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario separados</title>
</head>
<body>
    <h1>Registro de Participante - Cursos de Sacramentos</h1>
    <form action="/registrar" method="post">

        <fieldset>
            <legend>Datos Personales</legend>
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre">
            <label for="apellido">Apellido:</label>
            <input type="text" name="apellido" id="apellido">
        </fieldset>

        <fieldset>
            <legend>Datos de Contacto</legend>
            <label for="email">Correo electrónico:</label>
            <input type="email" name="email" id="email">
            <label for="telefono">Teléfono celular:</label>
            <input type="tel" name="telefono" id="telefono">
        </fieldset>

        <fieldset>
            <legend>Datos del Sacramento</legend>
            <label for="sacramento">Sacramento:</label>
            <select name="sacramento" id="sacramento">
                <option value="">-- Seleccione --</option>
                <option value="bautismo">Bautismo</option>
                <option value="comunion">Primera Comunión</option>
                <option value="confirmacion">Confirmación</option>
                <option value="matrimonio">Matrimonio</option>
            </select>
            <br>
            <label for="parroquia">Parroquia:</label>
            <input type="text" name="parroquia" id="parroquia" value="San Francisco - Quito">
        </fieldset>

        <fieldset>
            <legend>Confirmación</legend>
            <input type="checkbox" name="acepto" id="acepto">
            <label for="acepto">Acepto cumplir con todos los requisitos del curso</label>
        </fieldset>

        <button type="submit">Registrar participante</button>
        <button type="reset">Cancelar</button>
    </form>
</body>
</html>
